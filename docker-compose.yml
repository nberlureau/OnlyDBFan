version: "3.9"

services:

  redis:
    image: redis:latest
    container_name: redis-social
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  redis-service:
    build: ./redis-service
    container_name: redis-api
    ports:
      - "4003:4003"
    environment:
      - REDIS_URL=redis://redis-social:6379
    depends_on:
      - redis

volumes:
  redisdata:
